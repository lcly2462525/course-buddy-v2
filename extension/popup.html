<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 320px; margin: 0; padding: 12px; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .row { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
    input, select, button { font-size: 13px; padding: 6px 8px; border-radius: 8px; border: 1px solid #ccc; }
    input { flex: 1; }
    select { flex: 1; }
    button { cursor: pointer; border: none; color: #fff; }
    .primary { background: #2563eb; }
    .green { background: #059669; }
    .ghost { background: #6b7280; }
    button:disabled { opacity: .55; cursor: default; }
    #log { margin-top: 8px; font-size: 12px; color: #333; background: #f3f4f6; border-radius: 8px; padding: 8px; max-height: 140px; overflow: auto; white-space: pre-wrap; }
    a { color: #2563eb; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Course Buddy · 转录与笔记</h1>
  <div class="row">
    <input id="courseId" placeholder="课程 ID（在 Canvas 课程页会自动填）" />
    <button id="btnList" class="ghost">列回放</button>
  </div>
  <div class="row">
    <select id="replay"><option value="latest">最新一讲</option></select>
  </div>
  <div class="row">
    <button id="btnTxt" class="primary" style="flex:1">⬇ 下载转录</button>
    <button id="btnNote" class="green" style="flex:1">📝 生成笔记</button>
  </div>
  <div class="row"><a id="openOptions">⚙ 配置 LLM API Key…</a></div>
  <div id="log">就绪。</div>
  <script src="popup.js"></script>
</body>
</html>
